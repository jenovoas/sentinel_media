[package]
name = "me60os"
version = "0.1.0"
edition = "2021"

[lib]
name = "me60os_core"
path = "src/lib.rs"

[[bin]]
name = "me60os_daemon"
path = "src/main.rs"

[dependencies]
libc = "0.2"
regex = "1.10"
memmap2 = "0.9"
rayon = "1.10"
rand = "0.8"
libbpf-rs = "0.24"
once_cell = "1.19"
phf = { version = "0.11", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
anyhow = "1.0"
chrono = "0.4"
sysinfo = "0.38.0"
ctrlc = { version = "3.4", features = ["termination"] }
