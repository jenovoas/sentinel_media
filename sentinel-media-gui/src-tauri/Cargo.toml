[package]
name = "sentinel-media-gui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
log = "0.4"
lazy_static = "1.4"
nvml-wrapper = "0.11.0"
redis = { version = "0.32", features = ["tokio-comp"] }
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
regex = "1.10"
walkdir = "2.5"
sentinel_vault_agent = { path = "../../sentinel-vault-agent" }

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Lints de Clippy - Calidad de Código Industrial
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[lints.clippy]
# Grupos base con prioridad baja (-1) para permitir overrides
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Lints específicos elevados a deny/warn (prioridad 0, más alta)
unwrap_used = "deny"           # No permitir .unwrap() en producción
expect_used = "warn"            # Advertir sobre .expect()
panic = "deny"                  # No permitir panic! directo
todo = "warn"                   # Recordatorio de TODOs pendientes
unimplemented = "deny"          # No permitir código sin implementar

# Performance críticos
large_enum_variant = "warn"
large_stack_arrays = "warn"

# Permitir algunos lints pedantic que son demasiado estrictos
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
