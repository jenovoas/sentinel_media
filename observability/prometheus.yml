global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'sentinel-media-gui'
    static_configs:
      - targets: ['sentinel-media-gui:9091']

  - job_name: 'fenix-cortex'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['172.17.0.1:8000'] # IP usual del host en el puente de Docker (Linux)
