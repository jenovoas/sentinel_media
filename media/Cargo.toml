[package]
name = "sentinel_media"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sentinel_media"
path = "src/main.rs"

[lib]
name = "sentinel_media"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
dotenvy = "0.15"
colored = "2.0"
base64 = "0.21"
chrono = "0.4" 

# Dependencia Local
sentinel_core = { path = "../core" }